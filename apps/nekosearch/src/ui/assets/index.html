<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Catalog · NekoSearch</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/nekosearch.png" />
    <link rel="stylesheet" href="/dashboard.css" />
    <script type="module" src="/navigation.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Dashboard">
        <span class="brand"
          ><img
            src="/nekosearch.png"
            width="24"
            height="24"
            alt=""
          />NekoSearch</span
        >
        <a class="button nav-link" href="/" aria-current="page">Catalog</a>
        <a class="button nav-link" href="/usage">Usage</a>
        <a class="button nav-link" href="/about">About</a>
      </nav>
    </header>
    <main class="layout">
      <div class="page-header">
        <div>
          <h1 tabindex="-1">Catalog</h1>
        </div>
        <div class="page-actions">
          <button id="refresh" type="button" class="button secondary" disabled>
            Refresh
          </button>
          <a class="button prominent" href="/add">Add documentation</a>
        </div>
      </div>
      <p id="notice" class="notice" role="status">Loading the catalog…</p>
      <p id="restart" class="notice" hidden>
        Restart NekoSearch in your MCP client to pick up catalog changes.
      </p>
      <ul
        id="catalog"
        class="panel catalog"
        aria-label="Documentation snapshots"
        hidden
      ></ul>
      <template id="snapshot-row">
        <li class="snapshot">
          <div class="snapshot-main">
            <a class="snapshot-title-link"><strong></strong></a>
          </div>
          <div class="snapshot-actions"></div>
        </li>
      </template>
    </main>
  </body>
</html>
