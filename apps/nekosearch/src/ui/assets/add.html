<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Add documentation · NekoSearch</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/nekosearch.png" />
    <link rel="stylesheet" href="/dashboard.css" />
    <script type="module" src="/navigation.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Dashboard">
        <span class="brand"
          ><img
            src="/nekosearch.png"
            width="24"
            height="24"
            alt=""
          />NekoSearch</span
        >
        <a class="button nav-link" href="/">Catalog</a>
        <a class="button nav-link" href="/usage">Usage</a>
        <a class="button nav-link" href="/about">About</a>
      </nav>
    </header>
    <main class="layout">
      <div class="page-header">
        <h1 tabindex="-1">Add documentation</h1>
      </div>
      <p id="notice" class="notice" role="status">Loading the catalog…</p>
      <p id="restart" class="notice" hidden>
        Restart NekoSearch in your MCP client to pick up catalog changes.
      </p>
      <div class="add-options">
        <section class="panel add-option" aria-labelledby="curated-heading">
          <h2 id="curated-heading">Install a curated source</h2>
          <p class="muted">Download a supported documentation version.</p>
          <form id="curated-form" method="post">
            <label for="curated-source">Source and version</label>
            <select
              id="curated-source"
              name="selector"
              required
              disabled
            ></select>
            <button id="install" type="submit" class="button primary" disabled>
              Install source
            </button>
          </form>
        </section>
        <section class="panel add-option" aria-labelledby="local-heading">
          <h2 id="local-heading">Import a local folder</h2>
          <p class="muted">Index Markdown or MDX files on this machine.</p>
          <form id="local-form" method="post">
            <fieldset id="local-fields" disabled>
              <label for="directory">Absolute folder path</label>
              <input
                id="directory"
                name="directory"
                type="text"
                required
                spellcheck="false"
              />
              <label for="selector">Source and version</label>
              <input
                id="selector"
                name="selector"
                type="text"
                required
                maxlength="321"
                placeholder="my-api@1"
                spellcheck="false"
              />
              <button type="submit" class="button primary">
                Import folder
              </button>
            </fieldset>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
